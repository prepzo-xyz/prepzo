<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepzo</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    background: radial-gradient(circle at top, #141414, #0b0b0b);
    color: white;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 20px 40px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .logo {
    font-size: 26px;
    font-weight: 700;
  }

  /* HERO */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
  }

  .hero h1 {
    font-size: 70px;
    margin: 0;
  }

  .hero p {
    color: #b5b5b5;
    font-size: 18px;
    margin-top: 12px;
  }

  .btn {
    margin-top: 30px;
    padding: 14px 30px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn:hover {
    transform: scale(1.05);
  }

  footer {
    text-align: center;
    padding: 20px;
    color: #666;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .hero h1 {
      font-size: 42px;
    }

    .hero p {
      font-size: 14px;
    }

    header {
      padding: 15px 20px;
    }
  }
</style>
</head>

<body>

<header>
  <div class="logo">Prepzo</div>
</header>

<div class="hero">
  <h1>Prepzo</h1>
  <p>Your study companion for Grades 7–12</p>
  <p>Focus. Learn. Improve.</p>

  <button class="btn" onclick="location.href='grade.html'">
    Start Learning
  </button>
</div>

<footer>
  © 2026 Prepzo • Built for students
</footer>

</body>
</html>
