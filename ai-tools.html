<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepzo AI</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#0b0b0b;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
.header {
  padding:15px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  font-weight:600;
}

/* CHAT AREA */
.chat {
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* MESSAGE */
.msg {
  max-width:75%;
  padding:12px 16px;
  border-radius:12px;
  line-height:1.5;
}

.user {
  align-self:flex-end;
  background:white;
  color:black;
}

.bot {
  align-self:flex-start;
  background:#1a1a1a;
}

/* INPUT AREA */
.input-area {
  border-top:1px solid rgba(255,255,255,0.1);
  padding:10px;
  display:flex;
  gap:10px;
}

input {
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#111;
  color:white;
}

button {
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:white;
  color:black;
  cursor:pointer;
}

/* QUICK ACTIONS */
.quick {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:10px 20px;
}

.quick button {
  background:#222;
  color:white;
  border:1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<div class="header">🤖 Prepzo AI</div>

<div class="chat" id="chat"></div>

<div class="quick">
  <button onclick="quick('Explain this simply')">Explain</button>
  <button onclick="quick('Give summary')">Summary</button>
  <button onclick="quick('Important points')">Points</button>
</div>

<div class="input-area">
  <input id="input" placeholder="Ask anything..."/>
  <button onclick="send()">Send</button>
</div>

<script>
let chat = document.getElementById("chat");

function addMessage(text, type){
  let div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function send(){
  let input = document.getElementById("input");
  let text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(()=>reply(text), 500);
}

function quick(type){
  document.getElementById("input").value = type + " ";
}

function reply(text){
  let response = "";

  if(text.toLowerCase().includes("explain")){
    response = "Here's a simple explanation:\\n\\nBreak the concept into smaller parts and focus on understanding the basic idea behind it.";
  }
  else if(text.toLowerCase().includes("summary")){
    response = "Quick Summary:\\n\\n- Key idea 1\\n- Key idea 2\\n- Key idea 3";
  }
  else if(text.toLowerCase().includes("points")){
    response = "Important Points:\\n\\n• Point 1\\n• Point 2\\n• Point 3";
  }
  else{
    response = "I can help you with:\\n\\n• Explaining concepts\\n• Giving summaries\\n• Key points\\n\\nTry asking: 'Explain motion simply'";
  }

  addMessage(response, "bot");
}
</script>

</body>
</html>
