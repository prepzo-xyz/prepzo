<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepzo AI</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#0b0b0b;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header {
  padding:15px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.chat {
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.msg {
  max-width:75%;
  padding:12px 16px;
  border-radius:12px;
  line-height:1.5;
}

.user {
  align-self:flex-end;
  background:white;
  color:black;
}

.bot {
  align-self:flex-start;
  background:#1a1a1a;
}

.input-area {
  border-top:1px solid rgba(255,255,255,0.1);
  padding:10px;
  display:flex;
  gap:10px;
}

input {
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#111;
  color:white;
}

button {
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:white;
  color:black;
  cursor:pointer;
}

.quick {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:10px 20px;
}

.quick button {
  background:#222;
  color:white;
  border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="header">🤖 Prepzo AI</div>

<div class="chat" id="chat"></div>

<div class="quick">
  <button onclick="quick('Explain motion simply')">Explain</button>
  <button onclick="quick('Summary of force')">Summary</button>
  <button onclick="quick('Important points of atoms')">Points</button>
</div>

<div class="input-area">
  <input id="input" placeholder="Ask anything..."/>
  <button onclick="send()">Send</button>
</div>

<script>
let chat = document.getElementById("chat");

function addMessage(text, type){
  let div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function send(){
  let input = document.getElementById("input");
  let text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(()=>reply(text), 500);
}

function quick(text){
  document.getElementById("input").value = text;
}

/* SMART RESPONSE SYSTEM */
function reply(text){
  text = text.toLowerCase();

  let topic = detectTopic(text);
  let type = detectType(text);

  let response = generateResponse(topic, type);

  addMessage(response, "bot");
}

/* DETECT TYPE */
function detectType(text){
  if(text.includes("explain")) return "explain";
  if(text.includes("summary")) return "summary";
  if(text.includes("point")) return "points";
  if(text.includes("formula")) return "formula";
  return "general";
}

/* DETECT TOPIC */
function detectTopic(text){
  if(text.includes("motion")) return "motion";
  if(text.includes("force")) return "force";
  if(text.includes("atom")) return "atoms";
  if(text.includes("cell")) return "cell";
  if(text.includes("number")) return "numbers";
  return "general";
}

/* GENERATE RESPONSE */
function generateResponse(topic, type){

  let data = {
    motion: {
      explain: "Motion means movement of an object from one place to another over time.",
      summary: "Motion:\\n- Change in position\\n- Measured using distance & time",
      points: "• Distance\\n• Displacement\\n• Speed\\n• Velocity",
      formula: "Speed = Distance / Time"
    },
    force: {
      explain: "Force is a push or pull acting on an object.",
      summary: "Force:\\n- Push/Pull\\n- Changes motion",
      points: "• Contact force\\n• Non-contact force\\n• Net force",
      formula: "F = m × a"
    },
    atoms: {
      explain: "Atoms are the smallest units of matter.",
      summary: "Atoms:\\n- Basic unit\\n- Combine to form molecules",
      points: "• Proton\\n• Electron\\n• Neutron",
      formula: "No direct formula"
    },
    general: {
      explain: "Break the concept into small parts and understand step by step.",
      summary: "Focus on key ideas and revise regularly.",
      points: "• Read\\n• Understand\\n• Revise",
      formula: "Depends on topic"
    }
  };

  let selected = data[topic] || data["general"];

  return selected[type] || selected["explain"];
}
</script>

</body>
</html>
