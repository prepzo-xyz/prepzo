<!DOCTYPE html>
<html lang="en">
<head><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepzo - AI Tools</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    background: radial-gradient(circle at top, #141414, #0b0b0b);
    color: white;
  }

  header {
    padding: 16px 40px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.6);
    z-index: 10;
  }

  a {
    color: white;
    text-decoration: none;
    opacity: 0.8;
    transition: 0.2s;
  }

  a:hover {
    opacity: 1;
  }

  .container {
    max-width: 1000px;
    margin: auto;
    padding: 60px 20px;
  }

  h1 {
    font-size: 42px;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  p {
    color: #b5b5b5;
    line-height: 1.6;
  }

  /* CARDS */
  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 20px;
    border-radius: 16px;
    margin-top: 18px;
    transition: 0.25s;
    backdrop-filter: blur(10px);
  }

  .card:hover {
    transform: translateY(-6px);
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.2);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  /* BUTTONS */
  button {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #fff, #ddd);
    color: black;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  /* SMOOTH PAGE FEEL */
  * {
    scroll-behavior: smooth;
  }
</style>
</head>

<body>

<header>
  <div><a href="index.html">⬅ Back</a></div>
  <div>Prepzo AI Tools</div>
</header>

<div class="container">

  <h1>🤖 AI Tools</h1>
  <p style="color:#aaa;">Ask doubts and get smart study help instantly.</p>

  <div class="box">

    <h3>🧠 Doubt Solver</h3>
    <input id="question" placeholder="Ask your question..." />
    <button onclick="solve()">Get Answer</button>

    <div class="response" id="output"></div>

  </div>

</div>

<script>
function solve() {
  let q = document.getElementById("question").value.toLowerCase();
  let output = document.getElementById("output");

  if(q.includes("newton")) {
    output.innerHTML = "Newton's Laws explain motion and forces. First law: inertia, Second: F=ma, Third: action-reaction.";
  }
  else if(q.includes("photosynthesis")) {
    output.innerHTML = "Photosynthesis is the process where plants make food using sunlight, CO2 and water.";
  }
  else if(q.includes("derivative") || q.includes("math")) {
    output.innerHTML = "A derivative shows how a function changes. It represents rate of change in calculus.";
  }
  else {
    output.innerHTML = "Try asking about Newton, photosynthesis, or maths concepts. More topics coming soon!";
  }
}
</script>

</body>
</html>
