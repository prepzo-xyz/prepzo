<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepzo Chapter</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#0b0b0b;
  color:white;
  line-height:1.6;
}

.header {
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.section {
  padding:20px;
}

.box {
  background:rgba(255,255,255,0.03);
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

h3 {
  margin-top:0;
}
</style>
</head>

<body>

<div class="header">
  <h2 id="chapterTitle"></h2>
  <p id="info" style="color:#888;"></p>
</div>

<div class="section">

  <div class="box">
    <h3>📌 Key Points</h3>
    <ul>
      <li>Important concept 1</li>
      <li>Important concept 2</li>
      <li>Important concept 3</li>
    </ul>
  </div>

  <div class="box">
    <h3>🧠 Explanation</h3>
    <p>
      This is where your detailed explanation will go.
      Keep it simple and easy to revise before exams.
    </p>
  </div>

  <div class="box">
    <h3>📊 Formula / Summary</h3>
    <p>
      Key formulas or summary points will be shown here.
    </p>
  </div>

</div>

<script>
let grade = localStorage.getItem("grade");
let subject = localStorage.getItem("subject");
let chapter = localStorage.getItem("chapter");

document.getElementById("chapterTitle").innerText = chapter;

document.getElementById("info").innerText =
  subject + " • Grade " + grade;
</script>

</body>
</html>
