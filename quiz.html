<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepzo - Quiz</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: white;
  }

  header {
    padding: 20px 40px;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    justify-content: space-between;
  }

  a {
    color: white;
    text-decoration: none;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 60px 20px;
  }

  h1 {
    font-size: 40px;
  }

  .quiz-card {
    background: #151515;
    padding: 20px;
    margin-top: 20px;
    border-radius: 15px;
    border: 1px solid #222;
  }

  .option {
    margin-top: 10px;
    padding: 10px;
    background: #0f0f0f;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid #222;
  }

  .option:hover {
    background: #1c1c1c;
  }
</style>
</head>

<body>

<header>
  <div><a href="index.html">⬅ Back</a></div>
  <div>Prepzo Quiz</div>
</header>

<div class="container">

  <h1>🧠 Quizzes</h1>
  <p style="color:#aaa;">Test your knowledge quickly with MCQs.</p>

  <div class="quiz-card">
    <h3>1. What is Newton’s First Law?</h3>

    <div class="option">A. F = ma</div>
    <div class="option">B. Law of inertia</div>
    <div class="option">C. Energy conservation</div>
    <div class="option">D. Momentum law</div>
  </div>

</div>

</body>
</html>
