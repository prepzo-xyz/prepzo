<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepzo Notes</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background:#0b0b0b;
  color:white;
}

.header {
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.section {
  padding:20px;
}

.card {
  background:rgba(255,255,255,0.03);
  padding:18px;
  border-radius:12px;
  margin-bottom:15px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover {
  background:rgba(255,255,255,0.06);
}
</style>
</head>

<body>

<div class="header">
  <h2>📘 Notes</h2>
  <p id="info" style="color:#888;"></p>
</div>

<div class="section">

  <div class="card" onclick="go('Maths')">📐 Maths</div>
  <div class="card" onclick="go('Science')">🔬 Science</div>
  <div class="card" onclick="go('Biology')">🌱 Biology</div>
  <div class="card" onclick="go('Chemistry')">⚗️ Chemistry</div>

</div>

<script>
let grade = localStorage.getItem("grade") || "";
let board = localStorage.getItem("board") || "CBSE";

document.getElementById("info").innerText =
  "Grade " + grade + " • " + board;

function go(subject){
  localStorage.setItem("subject", subject);
  window.location.href = "chapters.html";
}
</script>

</body>
</html>
