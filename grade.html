<!DOCTYPE html>
<html>
<head>
<title>Select Grade</title>

<style>
body {
  margin:0;
  font-family: system-ui;
  background: radial-gradient(circle, #141414, #0b0b0b);
  color:white;
  text-align:center;
}

.container {
  padding:100px 20px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  max-width:500px;
  margin:auto;
  gap:15px;
}

.card {
  padding:20px;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover {
  background: rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div class="container">
  <h1>Select Your Grade</h1>
  <p style="color:#aaa;">Personalize your learning experience</p>

  <div class="grid">

    <div class="card" onclick="go(7)">Grade 7</div>
    <div class="card" onclick="go(8)">Grade 8</div>
    <div class="card" onclick="go(9)">Grade 9</div>
    <div class="card" onclick="go(10)">Grade 10</div>
    <div class="card" onclick="go(11)">Grade 11</div>
    <div class="card" onclick="go(12)">Grade 12</div>

  </div>
</div>

<script>
function go(grade){
  localStorage.setItem("grade", grade);
  window.location.href = "index.html";
}
</script>


</body>
</html>
